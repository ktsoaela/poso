[package]
name = "session-desktop"
version = "1.0.0"
description = "Session mail desktop shell"
authors = ["Khotso Tsoaela"]
edition = "2021"

[lib]
name = "session_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
getrandom = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
